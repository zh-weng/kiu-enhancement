name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python kiu.py --help
      - run: python -m unittest discover -s tests
      - run: python tools/build_release.py --check
      - run: python tools/build_release.py
  portable-apple-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python kiu.py --help
      - run: python -m unittest discover -s tests -p test_aim_core.py
      - run: python -m unittest discover -s tests -p test_asset_formats.py
      - run: python -m unittest discover -s tests -p test_gdbclient.py
