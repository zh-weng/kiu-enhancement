[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiu-enhancements"
version = "0.1.0.dev0"
description = "Build-locked Kid Icarus: Uprising enhancement companion for Azahar"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["capstone>=5,<6", "keystone-engine==0.9.2"]

[project.optional-dependencies]
assets = ["Pillow>=10"]

[project.scripts]
kiu-enhance = "tools.kiu_cli:main"

[tool.setuptools]
packages = ["tools"]
